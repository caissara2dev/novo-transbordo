name: Relatar bug
description: Registre um comportamento incorreto e reproduzível.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        É permitido agrupar bugs nesta issue: identifique cada correção e mantenha sua causa, solução, validação e estado.
        Causa, solução e validação podem ser completadas durante a investigação.
        Não inclua senhas, tokens, dados pessoais ou credenciais Firebase.
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Onde o problema ocorreu e qual impacto operacional ele causa?
      placeholder: Ambiente, tela, perfil do usuário e impacto.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste a sequência mínima para cada problema identificado.
      placeholder: |
        1. Acesse…
        2. Selecione…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado atual
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - Local
        - Homologação / staging
        - Produção
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão, tag ou URL do deploy
      placeholder: v2.2.0 ou URL do preview
  - type: textarea
    id: evidence
    attributes:
      label: Evidências sem dados sensíveis
      description: Inclua screenshots, mensagens de erro ou logs sanitizados.
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Como confirmaremos que cada correção foi validada?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Pesquisei issues abertas e encerradas; todas as correções estão identificadas e duplicatas ou recorrências foram vinculadas.
          required: true
        - label: Removi credenciais e dados pessoais das evidências.
          required: true
  - type: textarea
    id: cause
    attributes:
      label: Causa confirmada
      description: Preencher após investigar. Enquanto isso, indicar que a causa está em análise.
  - type: textarea
    id: resolution
    attributes:
      label: Solução e rastreabilidade
      description: "Para cada correção: como e por que foi corrigido; branch, commits, PR e outros registros relacionados."
  - type: textarea
    id: validation
    attributes:
      label: Validação e estado da entrega
      description: "Por correção: testes e resultados, antes/depois, ambiente validado, versão corrigida, rollback, estado e pendências. Distinguir local, homologação e produção."
