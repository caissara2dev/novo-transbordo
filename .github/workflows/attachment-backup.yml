name: Attachment backup tests
on:
  pull_request:
    branches: [main]
    paths:
      - infrastructure/attachment-backup/**
      - .github/workflows/attachment-backup.yml
  push:
    branches: [main]
    paths:
      - infrastructure/attachment-backup/**
      - .github/workflows/attachment-backup.yml
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v -s infrastructure/attachment-backup -p 'test_*.py'
