name: CI

on:
  pull_request:
    branches:
      - main
      - codex/checkin-v2-staging
  push:
    branches:
      - main
      - codex/checkin-v2-staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-transbordo.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-transbordo
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-transbordo.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      FIREBASE_PROJECT_ID: demo-transbordo
      APPROVAL_CONTACT_PHONE: +55-13-99999-9999

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Dependências
        run: npm ci

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificação completa
        run: npm run verify

  document-worker:
    name: Document worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infrastructure/checkin-documents/requirements.txt

      - name: Dependências do worker
        run: >-
          python -m pip install --only-binary=:all: -r infrastructure/checkin-documents/requirements.txt

      - name: Testes de prévias, retenção e exclusão
        run: python -m unittest discover -v -s infrastructure/checkin-documents -p 'test_*.py'
