  - variable: NEXT_PUBLIC_APP_ENV
    value: "production"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAjPDTl4hGdIOVvumoPdoysTMeFGWx_zY0"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "line-transbordo.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "line-transbordo"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "line-transbordo.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "382612530713"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:382612530713:web:fea8995134ab67f3caec88"
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: "line-transbordo"

  - variable: APPROVAL_CONTACT_PHONE
    value: "+55-13-99711-2838"

  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    value: "6LdgAG8tAAAAAArs8dpVhOE3MWy2E31y0JfUtrja"
    availability:
      - BUILD
      - RUNTIME

  # App Check remains non-blocking during the initial production observation.
  - variable: NEXT_PUBLIC_APP_CHECK_FAIL_CLOSED
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  - variable: APP_CHECK_MODE
    value: "observe"

  - variable: APP_CHECK_ALLOWED_APP_IDS
    value: "1:382612530713:web:fea8995134ab67f3caec88"

  - variable: RATE_LIMIT_MODE
    value: "observe"

  # Create this secret interactively with Firebase CLI. Never commit its value.
  - variable: RATE_LIMIT_HMAC_SECRET
    secret: RATE_LIMIT_HMAC_SECRET

  - variable: RATE_LIMIT_KEY_VERSION
    value: "v1"

  - variable: TRUSTED_PROXY_MODE
    value: "google-lb"
